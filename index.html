<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Temporizador Pomodoro para estudiar: funciona sin conexión, se puede instalar y guarda tus estadísticas.">
    <meta name="theme-color" content="#c8452f">
    <title>Estudio Pomodoro</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="iconos/icono-192.png">
    <link rel="stylesheet" href="css/estilos.css">
    <script type="module" src="js/app.js"></script>
</head>
<body data-fase="enfoque">
<header class="cabecera">
    <h1>Estudio Pomodoro</h1>
    <button type="button" class="boton-icono" id="abrir-ajustes" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/></svg>
    </button>
</header>

<main>
    <section class="temporizador" aria-label="Temporizador">
        <div class="fases" role="group" aria-label="Fase">
            <button type="button" class="fase" data-fase="enfoque" aria-pressed="true">Enfoque</button>
            <button type="button" class="fase" data-fase="descanso-corto" aria-pressed="false">Descanso</button>
            <button type="button" class="fase" data-fase="descanso-largo" aria-pressed="false">Descanso largo</button>
        </div>

        <div class="reloj">
            <svg viewBox="0 0 120 120" aria-hidden="true">
                <circle class="pista" cx="60" cy="60" r="54"/>
                <circle class="avance" id="avance" cx="60" cy="60" r="54" pathLength="100"/>
            </svg>
            <div class="reloj-texto">
                <p id="tiempo" class="tiempo" role="timer" aria-live="off">25:00</p>
                <p id="ciclo" class="ciclo">Pomodoro 1 de 4</p>
            </div>
        </div>

        <label class="tarea">
            <span class="visualmente-oculto">Tarea actual</span>
            <input id="tarea" type="text" maxlength="80" placeholder="¿En qué vas a trabajar?" autocomplete="off">
        </label>

        <div class="controles">
            <button type="button" id="reiniciar" class="boton-secundario" aria-label="Reiniciar (R)" title="Reiniciar (R)">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
            </button>
            <button type="button" id="iniciar" class="boton-principal">Iniciar</button>
            <button type="button" id="saltar" class="boton-secundario" aria-label="Saltar fase (S)" title="Saltar fase (S)">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M5 5v14l9-7-9-7Zm11 0h3v14h-3V5Z"/></svg>
            </button>
        </div>
        <p class="atajos">Atajos: <kbd>Espacio</kbd> iniciar/pausar · <kbd>R</kbd> reiniciar · <kbd>S</kbd> saltar</p>
        <p class="visualmente-oculto" id="anuncio" aria-live="assertive"></p>
    </section>

    <section class="estadisticas" aria-labelledby="titulo-estadisticas">
        <h2 id="titulo-estadisticas">Tu progreso</h2>
        <dl class="cifras">
            <div><dt>Hoy</dt><dd id="hoy-pomodoros">0</dd><dd class="detalle" id="hoy-minutos">0 min</dd></div>
            <div><dt>Racha</dt><dd id="racha">0</dd><dd class="detalle">días seguidos</dd></div>
            <div><dt>Últimos 7 días</dt><dd id="semana-minutos">0 min</dd><dd class="detalle">de enfoque</dd></div>
        </dl>
        <div class="grafica" id="grafica" role="img" aria-label="Pomodoros de los últimos 7 días"></div>
    </section>
</main>

<footer class="pie">
    <p>Hecho por <a href="https://github.com/pablosanchezcontento-afk">Pablo Sánchez</a> ·
        <a href="https://github.com/pablosanchezcontento-afk/estudio-pomodoro">Código fuente</a></p>
</footer>

<dialog id="ajustes" aria-labelledby="titulo-ajustes">
    <form id="form-ajustes" method="dialog">
        <h2 id="titulo-ajustes">Ajustes</h2>
        <fieldset>
            <legend>Duración (minutos)</legend>
            <div class="campos">
                <label>Enfoque <input name="enfoque" type="number" min="1" max="120" required></label>
                <label>Descanso <input name="descansoCorto" type="number" min="1" max="60" required></label>
                <label>Descanso largo <input name="descansoLargo" type="number" min="1" max="60" required></label>
                <label>Pomodoros hasta descanso largo <input name="pomodorosHastaLargo" type="number" min="2" max="10" required></label>
            </div>
        </fieldset>
        <label class="casilla"><input name="autoIniciar" type="checkbox"> Empezar la siguiente fase automáticamente</label>
        <label class="casilla"><input name="sonido" type="checkbox"> Sonido al terminar</label>
        <div class="notificaciones">
            <button type="button" id="permitir-notificaciones" class="boton-secundario">Activar notificaciones</button>
            <p id="estado-notificaciones" class="detalle"></p>
        </div>
        <div class="acciones">
            <button type="button" id="borrar-estadisticas" class="boton-peligro">Borrar estadísticas</button>
            <span class="separador"></span>
            <button type="button" id="cancelar-ajustes" class="boton-secundario">Cancelar</button>
            <button type="submit" class="boton-principal">Guardar</button>
        </div>
    </form>
</dialog>
</body>
</html>
